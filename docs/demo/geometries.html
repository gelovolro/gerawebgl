<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geometry Demo</title>

    <style>

        html, body {
            margin     : 0px;
            padding    : 0px;
            height     : 100%;
            background : #000000;
            overflow   : hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size  : 14px;
        }

        canvas {
            position: fixed;
            top     : 0px;
            left    : 0px;
            width   : 100%;
            height  : 100%;
            display : block;
        }

        #ui {
            position        : absolute;
            top             : 20px;
            left            : 20px;
            width           : 420px;
            padding         : 16px;
            background      : rgba(10, 16, 26, 0.88);
            border          : 1px solid rgba(255, 255, 255, 0.14);
            border-radius   : 12px;
            backdrop-filter : blur(12px);
            color           : #dbeafe;
            box-shadow      : 0px 10px 30px rgba(0, 0, 0, 0.45);
            pointer-events  : none;
            user-select     : none;
        }

        #ui * {
            pointer-events: auto;
        }

        .uiRow {
            display     : flex;
            align-items : center;
            gap         : 8px;
            margin-bottom: 10px;
            flex-wrap   : nowrap;
        }

        .uiRow:last-child {
            margin-bottom: 0px;
        }

        #ui label {
            display      : inline-block;
            width        : 140px;
            white-space  : nowrap;
            opacity      : 0.95;
        }

        #ui button,
        #ui select {
            background   : #1b2636;
            border       : 1px solid rgba(255, 255, 255, 0.15);
            color        : #dbeafe;
            padding      : 6px 12px;
            border-radius: 10px;
            box-shadow   : 0px 2px 0px rgba(0, 0, 0, 0.35);
            font-size    : 14px;
        }

        #ui button {
            cursor     : pointer;
            transition : background 0.15s ease, transform 0.08s ease;
        }

        #ui button:hover {
            background : #22324a;
        }

        #ui button:active {
            transform : translateY(1px);
        }

        #ui select {
            cursor              : pointer;
            width               : 100%;
            appearance          : none;
            background-image    : linear-gradient(45deg, transparent 50%, #dbeafe 50%),
                                  linear-gradient(135deg, #dbeafe 50%, transparent 50%);
            background-position : calc(100% - 16px) calc(50% - 2px),
                                  calc(100% - 10px) calc(50% - 2px);
            background-size     : 6px 6px;
            background-repeat   : no-repeat;
            padding-right       : 32px;
        }

        #ui input[type="range"] {
            -webkit-appearance : none;
            appearance         : none;
            width              : 180px;
            height             : 4px;
            border-radius      : 3px;
            background         : rgba(219, 234, 254, 0.28);
            outline            : none;
        }

        #ui input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance : none;
            appearance         : none;
            width              : 14px;
            height             : 14px;
            border-radius      : 50%;
            background         : #3b82f6;
            border             : 2px solid rgba(255, 255, 255, 0.85);
            cursor             : pointer;
        }

        #ui input[type="range"]::-moz-range-thumb {
            width         : 14px;
            height        : 14px;
            border-radius : 50%;
            background    : #3b82f6;
            border        : 2px solid rgba(255, 255, 255, 0.85);
            cursor        : pointer;
        }

        .value {
            width      : 48px;
            text-align : right;
            font-variant-numeric: tabular-nums;
        }

        .isHidden {
            display: none !important;
        }

        @media (max-width: 520px) {
            #ui {
                width: calc(100% - 40px);
            }

            #ui label {
                width: 130px;
            }

            #ui input[type="range"] {
                width: 160px;
            }
        }

    </style>
</head>

<body>
    <canvas id="glcanvas"></canvas>

    <div id="ui">
        <div class="uiRow" id="uiRowButtons">
            <button id="wireframeToggleButton">Wireframe: ON</button>
            <button id="recreateMeshButton" class="isHidden">Recreate mesh</button>
        </div>

        <div class="uiRow" id="uiRowGeometry">
            <label for="geometrySelect">Geometry:</label>
            <select id="geometrySelect"></select>
        </div>

        <div class="uiRow" id="uiRowSegments">
            <label id="segmentsLabel" for="segmentsSlider">Segments count:</label>
            <input id="segmentsSlider" type="range" min="3" max="64" step="1" value="16" />
            <span id="segmentsValue" class="value">16</span>
        </div>
    </div>

    <script type="module" src="./geometries-demo.js"></script>
</body>

</html>
