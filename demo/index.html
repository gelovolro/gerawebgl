<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Gera WebGL - demo</title>
    <style>

        html, body {
            margin     : 0px;
            padding    : 0px;
            height     : 100%;
            background : #000000;
            overflow   : hidden;
        }

        canvas {
            display : block;
            width   : 100%;
            height  : 100%;
        }

        #ui {
            position : fixed;
            top      : 10px;
            left     : 10px;
            z-index  : 10;
        }

        #wireframeToggleButton,
        #recreateMeshButton {
            padding     : 6px 12px;
            font-family : sans-serif;
            font-size   : 14px;
            cursor      : pointer;
        }

    </style>
</head>

<body>
    <div id="ui">
        <button id="wireframeToggleButton" type="button">Wireframe: OFF</button>
        <button id="recreateMeshButton" type="button">Recreate mesh (dispose test)</button>
    </div>

    <canvas id="glcanvas"></canvas>
    <script type="module" src="./gerawebgl.js"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
