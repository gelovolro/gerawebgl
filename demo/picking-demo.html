<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gera WebGL - picking/raycasting demo</title>
    <style>

        html, body {
            margin     : 0px;
            padding    : 0px;
            height     : 100%;
            background : #05070c;
            overflow   : hidden;
        }

        body {
            overscroll-behavior : none;
        }

        canvas {
            position     : fixed;
            top          : 0px;
            left         : 0px;
            display      : block;
            width        : 100vw;
            height       : 100vh;
            height       : 100dvh;
            touch-action : none;
        }

        #panel {
            position        : fixed;
            top             : calc(10px + env(safe-area-inset-top));
            left            : calc(10px + env(safe-area-inset-left));
            z-index         : 10;
            display         : flex;
            flex-direction  : column;
            gap             : 12px;
            width           : 260px;
            max-width       : calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right));
            padding         : 12px;
            background      : rgba(10, 30, 60, 0.28);
            border          : 1px solid rgba(120, 180, 255, 0.22);
            border-radius   : 10px;
            box-shadow      : 0px 8px 24px rgba(0, 0, 0, 0.35);
            backdrop-filter : blur(10px);
            color           : rgba(235, 247, 255, 0.95);
            font-family     : sans-serif;
            font-size       : 14px;
            pointer-events  : none;
        }

        #panel button,
        #panel select,
        #panel input,
        #panel label,
        #panel span {
            pointer-events : auto;
        }

        .panelSection {
            display        : flex;
            flex-direction : column;
            gap            : 6px;
        }

        .panelTitle {
            font-size      : 12px;
            font-weight    : 700;
            text-transform : uppercase;
            letter-spacing : 0.02em;
            opacity        : 0.92;
            text-shadow    : 0px 1px 2px rgba(0, 0, 0, 0.35);
        }

        .panelRow {
            display         : flex;
            justify-content : space-between;
            align-items     : baseline;
            gap             : 12px;
        }

        .panelLabel {
            font-size   : 12px;
            opacity     : 0.82;
            color       : rgba(170, 210, 255, 0.95);
            text-shadow : 0px 1px 2px rgba(0, 0, 0, 0.35);
        }

        .panelValue {
            font-family : ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size   : 12px;
            text-shadow : 0px 1px 2px rgba(0, 0, 0, 0.35);
        }

        #clearSelectionButton {
            padding       : 6px 12px;
            border-radius : 10px;
            border        : 1px solid rgba(120, 190, 255, 0.35);
            background    : linear-gradient(180deg, rgba(110, 190, 255, 0.22), rgba(30, 90, 160, 0.18));
            color         : rgba(235, 247, 255, 0.95);
            font-size     : 14px;
            cursor        : pointer;
            outline       : none;
            box-shadow    : 0px 6px 16px rgba(0, 0, 0, 0.28);
            transition    : transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
        }

        #clearSelectionButton:hover:not(:disabled) {
            border-color : rgba(160, 210, 255, 0.55);
            box-shadow   : 0px 10px 22px rgba(0, 0, 0, 0.34);
            transform    : translateY(-1px);
        }

        #clearSelectionButton:active:not(:disabled) {
            transform  : translateY(0px);
            box-shadow : 0px 6px 16px rgba(0, 0, 0, 0.28);
        }

        #clearSelectionButton:disabled {
            opacity : 0.55;
            cursor  : default;
        }

        @media (max-width: 768px) {
            #panel {
                width   : 220px;
                padding : 10px;
                gap     : 10px;
            }

            #clearSelectionButton {
                font-size : 13px;
            }
        }

        .gwFpsCounter {
            position        : fixed;
            right           : calc(10px + env(safe-area-inset-right));
            bottom          : calc(10px + env(safe-area-inset-bottom));
            z-index         : 11;
            display         : flex;
            flex-direction  : column;
            gap             : 6px;
            min-width       : 128px;
            padding         : 10px 12px;
            background      : rgba(10, 30, 60, 0.22);
            border          : 1px solid rgba(120, 180, 255, 0.22);
            border-radius   : 12px;
            box-shadow      : 0px 12px 26px rgba(0, 0, 0, 0.35);
            backdrop-filter : blur(12px);
            color           : rgba(235, 247, 255, 0.95);
            user-select     : none;
            letter-spacing  : 0.02em;
            font-family     : ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        .gwFpsCounterHeader {
            font-family    : sans-serif;
            font-size      : 11px;
            font-weight    : 600;
            text-transform : uppercase;
            opacity        : 0.92;
            text-shadow    : 0px 1px 2px rgba(0, 0, 0, 0.35);
        }

        .gwFpsCounterRow {
            display         : flex;
            justify-content : space-between;
            gap             : 12px;
            align-items     : baseline;
        }

        .gwFpsCounterRowLabel {
            font-size   : 11px;
            opacity     : 0.8;
            text-shadow : 0px 1px 2px rgba(0, 0, 0, 0.35);
        }

        .gwFpsCounterRowValue {
            font-size   : 16px;
            font-weight : 700;
            text-shadow : 0px 1px 2px rgba(0, 0, 0, 0.35);
        }

        .gwFpsCounter-good {
            border-color : rgba(140, 255, 195, 0.32);
            box-shadow   : 0px 12px 28px rgba(0, 0, 0, 0.35), 0px 0px 18px rgba(140, 255, 195, 0.18);
        }

        .gwFpsCounter-ok {
            border-color : rgba(255, 220, 140, 0.32);
            box-shadow   : 0px 12px 28px rgba(0, 0, 0, 0.35), 0px 0px 18px rgba(255, 220, 140, 0.15);
        }

        .gwFpsCounter-bad {
            border-color : rgba(255, 140, 140, 0.32);
            box-shadow   : 0px 12px 28px rgba(0, 0, 0, 0.35), 0px 0px 18px rgba(255, 140, 140, 0.14);
        }

        .panelSlider {
            width      : 100%;
            height     : 22px;
            margin     : 4px 0px 0px 0px;
            background : transparent;
            cursor     : pointer;
        }

        .panelSlider:disabled {
            opacity : 0.6;
            cursor  : default;
        }

        .panelSlider::-webkit-slider-runnable-track {
            height        : 6px;
            border-radius : 999px;
            background    : rgba(120, 180, 255, 0.22);
            border        : 1px solid rgba(120, 180, 255, 0.22);
        }

        .panelSlider::-webkit-slider-thumb {
            -webkit-appearance : none;
            appearance         : none;
            width              : 14px;
            height             : 14px;
            border-radius      : 999px;
            margin-top         : -4px;
            background         : rgba(235, 247, 255, 0.95);
            border             : 1px solid rgba(120, 180, 255, 0.35);
            box-shadow         : 0px 6px 14px rgba(0, 0, 0, 0.28);
        }

        .panelSlider::-moz-range-track {
            height        : 6px;
            border-radius : 999px;
            background    : rgba(120, 180, 255, 0.22);
            border        : 1px solid rgba(120, 180, 255, 0.22);
        }

        .panelSlider::-moz-range-thumb {
            width         : 14px;
            height        : 14px;
            border-radius : 999px;
            background    : rgba(235, 247, 255, 0.95);
            border        : 1px solid rgba(120, 180, 255, 0.35);
            box-shadow    : 0px 6px 14px rgba(0, 0, 0, 0.28);
        }

    </style>
</head>

<body>
    <div id="panel">
        <div class="panelSection">
            <div class="panelTitle">Hover cube</div>

            <div class="panelRow">
                <span class="panelLabel">Name</span>
                <span id="hoveredNameValue" class="panelValue">None</span>
            </div>

            <div class="panelRow">
                <span class="panelLabel">Distance</span>
                <span id="hoveredDistanceValue" class="panelValue">-</span>
            </div>
        </div>

        <div class="panelSection">
            <div class="panelTitle">Selected cube</div>

            <div class="panelRow">
                <span class="panelLabel">Name</span>
                <span id="selectedNameValue" class="panelValue">None</span>
            </div>

            <div class="panelRow">
                <span class="panelLabel">Position</span>
                <span id="selectedPositionValue" class="panelValue">-</span>
            </div>

            <div class="panelRow">
                <span class="panelLabel">Rotation</span>
                <span id="selectedRotationValue" class="panelValue">-</span>
            </div>

            <div class="panelRow">
                <span class="panelLabel">Scale</span>
                <span id="selectedScaleValue" class="panelValue">-</span>
            </div>

            <button id="clearSelectionButton" type="button">Clear selection</button>
        </div>

        <div class="panelSection">
            <div class="panelTitle">Camera</div>

            <div class="panelRow">
                <span class="panelLabel">Zoom</span>
                <span id="zoomValue" class="panelValue">-</span>
            </div>

            <input id="zoomSlider" class="panelSlider" type="range" />
        </div>
    </div>

    <canvas id="glcanvas"></canvas>
    <script type="module" src="./picking-demo.js"></script>
</body>

</html>
