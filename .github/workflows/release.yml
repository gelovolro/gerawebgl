name: Release check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Read and check the package version
        id: package
        shell: bash
        run: |
          packageVersion="$(node -p "require('./package.json').version")"
          lockVersion="$(node -p "require('./package-lock.json').version")"

          if [ "${packageVersion}" != "${lockVersion}" ]; then
              echo "The package.json and package-lock.json versions do not match."
              exit 1
          fi

          echo "version=${packageVersion}" >> "${GITHUB_OUTPUT}"
          echo "Package version: ${packageVersion}"

      - name: Check the future git tag
        shell: bash
        run: |
          version="${{ steps.package.outputs.version }}"

          if git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null 2>&1; then
              echo "git tag '${version}' already exists."
          else
              echo "git tag '${version}' is available."
          fi

      - name: Restore the dependencies, build, run the tests and create the NPM package
        uses: ./.github/actions/base-preparation

      - name: Show the generated NPM package
        shell: bash
        run: ls -lh *.tgz
