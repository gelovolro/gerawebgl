name: Publish packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact git tag and package version
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-packages-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish-npmjs:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.preparation.outputs.version }}
      dist_tag: ${{ steps.preparation.outputs.dist_tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Prepare the release package
        id: preparation
        uses: ./.github/actions/release-preparation
        with:
          version: ${{ inputs.version }}

      - name: Publish to npmjs
        shell: bash
        run: npm publish --access public --tag "${{ steps.preparation.outputs.dist_tag }}"

  update-npmjs-latest:
    needs: publish-npmjs
    if: needs.publish-npmjs.outputs.dist_tag != 'latest'
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Node.js for npmjs
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update the latest npmjs tag
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: |
          npm dist-tag add \
            "gerawebgl@${{ needs.publish-npmjs.outputs.version }}" \
            latest \
            --registry=https://registry.npmjs.org

  publish-github-packages:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.preparation.outputs.version }}
      dist_tag: ${{ steps.preparation.outputs.dist_tag }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gelovolro'
          package-manager-cache: false

      - name: Prepare the release package
        id: preparation
        uses: ./.github/actions/release-preparation
        with:
          version: ${{ inputs.version }}

      - name: Prepare the GitHub package metadata
        shell: bash
        run: |
          npm pkg set name="@gelovolro/gerawebgl"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --ignore-scripts --tag "${{ steps.preparation.outputs.dist_tag }}"

  update-github-packages-latest:
    needs: publish-github-packages
    if: needs.publish-github-packages.outputs.dist_tag != 'latest'
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@gelovolro'
          package-manager-cache: false

      - name: Update the latest GitHub Packages tag
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm dist-tag add \
            "@gelovolro/gerawebgl@${{ needs.publish-github-packages.outputs.version }}" \
            latest \
            --registry=https://npm.pkg.github.com
